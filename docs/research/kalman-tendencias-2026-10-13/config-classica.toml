# Alternativa com maior continuidade de cor e linha mais afastada do preço.
# UsaTec/UsaInd, gráfico M5. Substituir somente [studies.kalman].
[studies.kalman]
visible = true
window = 50
level_noise = 0.02
slope_noise = 0.002
measurement_noise = 1.0
band_sigma = 1.96
slope_threshold = 1.0
slope_exit = 0.0
adaptive = "off"
# Estes três parâmetros ficam inativos no modo off.
adapt_gain = 2.0
adapt_span = 20
adapt_cap = 4.0
confluence = ["M5", "H1"]
coloring = "slope"
ribbon = true
background = true
background_alpha = 22
legend = true
bands = true
width = 2.0
